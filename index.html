<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070b14">

  <title>Join Our Telegram</title>

  <!-- Automatic redirect after 4 seconds -->
  <meta http-equiv="refresh"
        content="4;url=https://t.me/+fwDhLvlTZJAzZmE1">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;

      font-family: Arial, Helvetica, sans-serif;
      color: white;

      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(0, 180, 255, 0.20),
          transparent 30%
        ),
        radial-gradient(
          circle at 80% 80%,
          rgba(99, 102, 241, 0.22),
          transparent 30%
        ),
        #070b14;
    }

    .card {
      width: min(430px, 100%);
      padding: 38px 28px;

      text-align: center;

      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;

      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(18px);

      box-shadow:
        0 25px 80px rgba(0, 0, 0, 0.45);
    }

    /* IMAGE / LOGO */

    .logo {
      width: 95px;
      height: 95px;

      margin: 0 auto 22px;

      border-radius: 24px;
      overflow: hidden;

      box-shadow:
        0 12px 35px rgba(41, 169, 234, 0.35);
    }

    .logo img {
      width: 100%;
      height: 100%;

      display: block;
      object-fit: cover;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    p {
      color: #aeb8ca;
      line-height: 1.6;
      font-size: 15px;
    }

    /* LOADING ANIMATION */

    .loader {
      width: 58px;
      height: 58px;

      margin: 28px auto 20px;

      border: 4px solid rgba(255, 255, 255, 0.12);
      border-top-color: #29a9ea;

      border-radius: 50%;

      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* TELEGRAM BUTTON */

    .btn {
      display: inline-block;

      margin-top: 20px;
      padding: 15px 27px;

      border-radius: 14px;

      color: white;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;

      background:
        linear-gradient(
          135deg,
          #29a9ea,
          #6366f1
        );

      box-shadow:
        0 10px 28px rgba(41, 169, 234, 0.25);

      transition: 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .small {
      margin-top: 18px;
      font-size: 12px;
      color: #748097;
    }

  </style>
</head>

<body>

  <main class="card">

    <!-- YOUR IMAGE -->
    <div class="logo">
      <img src="logo.jpg" alt="Telegram Channel Logo">
    </div>

    <h1>Join Our Telegram</h1>

    <p>
      You are being redirected to our official
      Telegram channel.
      Start earning now 💸💰💰
    </p>

    <div class="loader"></div>

    <p>
      Redirecting in a few seconds...
    </p>

    <a
      class="btn"
      href="https://t.me/+fwDhLvlTZJAzZmE1"
    >
      Open Telegram
    </a>

    <div class="small">
      Please wait while we redirect you securely.
    </div>

  </main>

</body>
</html>
